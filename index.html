<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Search any city for current weather, an hourly outlook and a 7-day forecast.">
  <title>Weather App</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <h1 class="brand">Weather</h1>
    <form id="searchForm" class="search" novalidate>
      <label for="cityInput">City</label>
      <div class="search-field">
        <input
          id="cityInput"
          type="text"
          placeholder="Type a city (ex: Seattle)"
          autocomplete="off"
          role="combobox"
          aria-expanded="false"
          aria-controls="citySuggestions"
          aria-autocomplete="list"
          aria-haspopup="listbox"
        />
        <ul id="citySuggestions" role="listbox" hidden></ul>
      </div>
      <button id="getWeatherBtn" type="submit">Get Weather</button>
    </form>
  </header>

  <main class="page">
    <p id="status" role="status" aria-live="polite"></p>

    <div id="results" hidden>
      <section class="hero" id="hero" aria-labelledby="cityName">
        <img id="heroPhoto" class="hero-photo" alt="" loading="lazy">
        <div class="hero-body">
          <div class="hero-place">
            <h2 id="cityName"></h2>
            <p id="placeMeta"></p>
          </div>
          <div class="hero-now">
            <p id="temp" class="temp"></p>
            <div class="hero-cond">
              <span id="condIcon" class="cond-icon" aria-hidden="true"></span>
              <div>
                <p id="condText"></p>
                <p id="highLow"></p>
              </div>
            </div>
          </div>
        </div>
      </section>
      <p id="photoCredit" class="credit" hidden></p>

      <dl class="stats" aria-label="Current details">
        <div><dt>Feels like</dt><dd id="feels"></dd></div>
        <div><dt>Humidity</dt><dd id="humidity"></dd></div>
        <div><dt>Wind</dt><dd id="wind"></dd></div>
        <div><dt>Chance of rain</dt><dd id="rainChance"></dd></div>
        <div><dt>Sunrise</dt><dd id="sunrise"></dd></div>
        <div><dt>Sunset</dt><dd id="sunset"></dd></div>
      </dl>

      <section class="panel" aria-labelledby="hourlyTitle">
        <h2 id="hourlyTitle">Next 24 hours</h2>
        <ol id="hourly" class="hourly" tabindex="0" aria-label="Hourly forecast, scrolls sideways"></ol>
      </section>

      <section class="panel" aria-labelledby="dailyTitle">
        <h2 id="dailyTitle">7-day forecast</h2>
        <ol id="daily" class="daily"></ol>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <p>Weather data by <a href="https://open-meteo.com/">Open-Meteo.com</a> (CC BY 4.0). City photos from Wikimedia Commons, each under its own license.</p>
  </footer>

  <script src="./script.js"></script>
</body>
</html>
